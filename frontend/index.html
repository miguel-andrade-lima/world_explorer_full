<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>World Explorer</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🌎 World Explorer</h1>
        <p>Explore países e descubra o mundo.</p>
    </header>

    <main>
        <section class="pesquisa">
            <h2>Encontre um país</h2>

            <form id="form-pesquisa">
                <input
                    type="text"
                    id="nome-pais"
                    placeholder="Digite o nome de um país"
                    aria-label="Nome do país"
                    required
                >

                <button type="submit">Pesquisar</button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section>
            <h2>Resultados</h2>
            <div id="resultados" class="resultados"></div>
        </section>
    </main>

    <footer>
        <p>World Explorer — Descubra o mundo.</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
